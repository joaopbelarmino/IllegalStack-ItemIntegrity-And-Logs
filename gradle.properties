org.gradle.daemon=true
# Gradle 8 writes Java worker argfiles using this charset on Windows. Keeping
# it aligned with the OS avoids corrupting the accented user-home path.
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=windows-1252
org.gradle.configureondemand=true
org.gradle.parallel=true
